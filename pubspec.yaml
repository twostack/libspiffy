name: libspiffy
description: An actor-based Bitcoin SPV Wallet Library
version: 1.1.0
repository: https://github.com/twostack/libspiffy

environment:
  sdk: ^3.5.1

dependencies:
  # Core dependencies
  isar: ^3.1.0+1
  cbor: ^6.0.0
  meta: ^1.16.0
  uuid: ^4.5.1
  logging: ^1.2.0
  convert: ^3.1.1
  cryptography: ^2.7.0
  http: ^1.1.0
  crypto: ^3.0.3
  buffer: ^1.1.1
  synchronized: ^3.1.0

  # PostgreSQL support (optional - for server-side deployments)
  postgres: ^3.4.4

  # Actor system foundation
  dactor: ^1.2.0

  # Durable queuing
  duraq: ^1.0.0

  # Event sourcing
  eventador: ^1.0.0

  # SPV and P2P networking
  spiffynode: ^1.1.0

  # Bitcoin SV operations
  dartsv: ^3.0.0

  pointycastle: ^3.0.0

dev_dependencies:
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.7
  test: ^1.24.0
  mockito: ^5.4.2
  lints: ^5.0.0
  dactor_test: ^1.0.0
  # Token operations (dev-only: for integration tests, not a runtime dependency)
  tstokenlib: ^1.4.0
