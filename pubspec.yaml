name: libspiffy
description: >-
  An actor-based Bitcoin SV SPV wallet library: event-sourced wallets, BEEF
  payments with merkle-proof validation, ARC broadcast, payment channels and
  pluggable token scripts.
version: 4.3.0
repository: https://github.com/twostack/libspiffy
issue_tracker: https://github.com/twostack/libspiffy/issues
topics:
  - bitcoin
  - wallet
  - spv
  - event-sourcing
  - actors

environment:
  sdk: ^3.5.1

dependencies:
  # Core dependencies
  isar_community: ^3.3.2
  cbor: ^6.0.0
  meta: ^1.16.0
  uuid: ^4.5.1
  logging: ^1.2.0
  convert: ^3.1.1
  cryptography: ^2.7.0
  http: ^1.1.0
  crypto: ^3.0.3
  buffer: ^1.1.1
  synchronized: ^3.1.0
  hex: ^0.2.0
  collection: ^1.17.1

  # PostgreSQL support (optional - for server-side deployments)
  postgres: ^3.4.4

  # Actor system foundation
  dactor: ^1.3.0

  # Durable queuing
  duraq: ^3.0.0
  duraq_isar: ^3.0.0

  # Event sourcing
  eventador: ^4.0.0

  # SPV and P2P networking
  spiffynode: ^1.1.0

  # Bitcoin SV operations
  dartsv: ^3.0.0

  pointycastle: ^3.0.0

dev_dependencies:
  isar_community_generator: ^3.3.2
  build_runner: ^2.7.0
  test: ^1.24.0
  mockito: ^5.5.0
  lints: ^5.0.0
  dactor_test: ^1.0.0
  # Token operations (dev-only: for integration tests, not a runtime dependency)
  tstokenlib: ^1.4.0


dependency_overrides:
  # isar_community 3.3.2 with the native library built on libmdbx v0.13.12.
  # The published 3.3.2 binary (libmdbx v0.13.8-temp-upstream-fix) preallocates
  # the whole new file size past the end of the database file on every growth
  # step on macOS and iOS: a full testnet header store held about 59 GiB on
  # disk. Remove when isar_community releases isar-community/isar-community#129.
  isar_community:
    git:
      url: https://github.com/stephanfeb/isar-community.git
      ref: 3.3.2-libmdbx-0.13.12
      path: packages/isar_community
