# Test configuration for libspiffy
#
# Run all tests:
#   dart test
#
# Run PostgreSQL tests only (requires running PostgreSQL):
#   dart test --tags=postgres
#
# Skip PostgreSQL tests:
#   dart test --exclude-tags=postgres
#
# Run integration tests:
#   dart test --tags=integration

tags:
  postgres:
    # PostgreSQL integration tests - require a running PostgreSQL instance
    # See test/storage/postgres/postgres_integration_test.dart for setup instructions
  integration:
    # Integration tests that may require external services or longer execution time
  localnet:
    # Runs against the regtest Teranode + Arcade stack in ../localnet-teranode
    # and mines blocks on its shared chain, so it runs only when asked for:
    #   dart test -P localnet test/integration/localnet_channel_e2e_test.dart
    skip: "needs ../localnet-teranode; run with -P localnet"

  svnode:
    # Runs against an SV Node's JSON-RPC (:18332), as the retired ../localnet
    # stack served it: NodeRpcDataSource reads proofs with gettxoutproof,
    # which Teranode does not implement.
    #   dart test -P svnode test/integration/node_rpc_data_source_test.dart
    skip: "needs an SV Node RPC at :18332; run with -P svnode"

  arcade:
    # Runs against the BSV Association's public testnet Arcade and reads
    # testnet transactions from WhatsOnChain, so it runs only when asked for:
    #   dart test -P arcade test/integration/arcade_testnet_live_test.dart
    skip: "needs the public testnet Arcade; run with -P arcade"

presets:
  localnet:
    tags:
      localnet:
        skip: false
  svnode:
    tags:
      svnode:
        skip: false
  arcade:
    tags:
      arcade:
        skip: false

# Increase timeout for slow tests
timeout: 2m

# Run test suites sequentially to avoid Isar native library concurrency issues.
# Isar's initializeIsarCore is not safe for concurrent calls across isolates.
concurrency: 1
